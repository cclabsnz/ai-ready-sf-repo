<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Two layers of control. On the laptop, the guard hook runs before every Claude Code tool call, blocks deploys, pushes and org calls, and in build mode allows writes only to the files in the build package. It is best effort and catches mistakes early. Work then goes to a pull request, where CI runs the real-data scan, the Apex rules, the criterion-to-test trace and the impact and overlap checks, and branch protection with code owners decides what merges."><title>Two layers of control. On the laptop, the guard hook runs before every Claude Code tool call, blocks deploys, pushes and org calls, and in build mode allows writes only to the files in the build package. It is best effort and catches mistakes early. Work then goes to a pull request, where CI runs the real-data scan, the Apex rules, the criterion-to-test trace and the impact and overlap checks, and branch protection with code owners decides what merges.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cc3a1f"/></marker></defs><rect x="0" y="0" width="640" height="360" fill="#ffffff" stroke="#a8a097" stroke-width="1"/><text x="320" y="38" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="12" fill="#6b635a" text-anchor="middle" letter-spacing="1.5">TWO LAYERS OF CONTROL</text><text x="150" y="74" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="11" fill="#6b635a" text-anchor="middle" letter-spacing="1.2">ON THE LAPTOP</text><text x="490" y="74" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="11" fill="#cc3a1f" text-anchor="middle" letter-spacing="1.2">ON THE PULL REQUEST</text><rect x="20" y="88" width="260" height="190" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="150" y="116" font-family="Georgia, 'Source Serif 4', serif" font-size="16" fill="#141312" text-anchor="middle" font-weight="600">The guard hook</text><text x="150" y="146" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">runs before every tool call</text><text x="150" y="170" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">blocks deploys, pushes, org calls</text><text x="150" y="194" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">build mode: only the package's files</text><text x="150" y="218" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">modes change only from a terminal</text><line x1="40" y1="236" x2="260" y2="236" stroke="#a8a097" stroke-width="1"/><text x="150" y="259" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle" font-style="italic">best effort: catches mistakes early</text><polyline points="282,183 356,183" fill="none" stroke="#cc3a1f" stroke-width="2" marker-end="url(#arr)"/><text x="319" y="173" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="10" fill="#6b635a" text-anchor="middle">PR</text><rect x="360" y="88" width="260" height="190" fill="#ffffff" stroke="#cc3a1f" stroke-width="2"/><text x="490" y="116" font-family="Georgia, 'Source Serif 4', serif" font-size="16" fill="#141312" text-anchor="middle" font-weight="600">CI and branch protection</text><text x="490" y="146" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">real-data scan, Apex rules</text><text x="490" y="170" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">every criterion traced to a test</text><text x="490" y="194" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">impact and overlap checks</text><text x="490" y="218" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#141312" text-anchor="middle">code owners review guard changes</text><line x1="380" y1="236" x2="600" y2="236" stroke="#a8a097" stroke-width="1"/><text x="490" y="259" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#cc3a1f" text-anchor="middle" font-style="italic">the control: decides what merges</text><text x="320" y="316" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-style="italic">A local hook can be worked around. Required checks cannot be skipped by the assistant.</text></svg>
