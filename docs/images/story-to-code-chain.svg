<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" role="img" aria-label="The chain from story to code in ai-ready-sf-repo. Six steps run top to bottom. In three of them the assistant drafts something (story-refine, solution-design, story-impact) and a person confirms it. A maintainer then builds the package, a developer starts the build session in a real terminal, the assistant writes tests first and code inside scope, and a named reviewer reviews the pull request before required checks let it merge."><title>The chain from story to code in ai-ready-sf-repo. Six steps run top to bottom. In three of them the assistant drafts something (story-refine, solution-design, story-impact) and a person confirms it. A maintainer then builds the package, a developer starts the build session in a real terminal, the assistant writes tests first and code inside scope, and a named reviewer reviews the pull request before required checks let it merge.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cc3a1f"/></marker></defs><rect x="0" y="0" width="640" height="590" fill="#ffffff" stroke="#a8a097" stroke-width="1"/><text x="320" y="38" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="12" fill="#6b635a" text-anchor="middle" letter-spacing="1.5">FROM STORY TO CODE: WHO DOES WHAT</text><text x="185" y="74" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="11" fill="#6b635a" text-anchor="middle" letter-spacing="1.2">THE ASSISTANT DRAFTS</text><text x="490" y="74" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="11" fill="#cc3a1f" text-anchor="middle" letter-spacing="1.2">A PERSON DECIDES</text><line x1="32" y1="104" x2="32" y2="505" stroke="#a8a097" stroke-width="1"/><circle cx="32" cy="121" r="13" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="32" y="126" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="13" fill="#141312" text-anchor="middle">1</text><rect x="60" y="90" width="250" height="62" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="185" y="116" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="14" fill="#141312" text-anchor="middle" font-weight="700">story-refine</text><text x="185" y="137" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">criteria, edge cases, open questions</text><polyline points="310,121 356,121" fill="none" stroke="#cc3a1f" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="90" width="260" height="62" fill="#ffffff" stroke="#cc3a1f" stroke-width="2"/><text x="490" y="116" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-weight="600">Product Owner</text><text x="490" y="137" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">answers, then promotes story.json</text><circle cx="32" cy="195" r="13" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="32" y="200" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="13" fill="#141312" text-anchor="middle">2</text><rect x="60" y="164" width="250" height="62" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="185" y="190" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="14" fill="#141312" text-anchor="middle" font-weight="700">solution-design</text><text x="185" y="211" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">2 to 4 options, always "do nothing"</text><polyline points="310,195 356,195" fill="none" stroke="#cc3a1f" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="164" width="260" height="62" fill="#ffffff" stroke="#cc3a1f" stroke-width="2"/><text x="490" y="190" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-weight="600">Owner</text><text x="490" y="211" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">chooses one option</text><circle cx="32" cy="269" r="13" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="32" y="274" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="13" fill="#141312" text-anchor="middle">3</text><rect x="60" y="238" width="250" height="62" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="185" y="264" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="14" fill="#141312" text-anchor="middle" font-weight="700">story-impact</text><text x="185" y="285" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">components, evidence, overlaps</text><polyline points="310,269 356,269" fill="none" stroke="#cc3a1f" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="238" width="260" height="62" fill="#ffffff" stroke="#cc3a1f" stroke-width="2"/><text x="490" y="264" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-weight="600">Owner</text><text x="490" y="285" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">promotes impact.json to the register</text><circle cx="32" cy="343" r="13" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="32" y="348" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="13" fill="#141312" text-anchor="middle">4</text><rect x="60" y="312" width="250" height="62" fill="#ffffff" stroke="#a8a097" stroke-width="1" stroke-dasharray="4 4"/><text x="185" y="348" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#a8a097" text-anchor="middle" font-style="italic">no assistant step</text><rect x="360" y="312" width="260" height="62" fill="#ffffff" stroke="#cc3a1f" stroke-width="2"/><text x="490" y="338" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-weight="600">Maintainer</text><text x="490" y="359" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">package.py: the exact files in scope</text><circle cx="32" cy="417" r="13" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="32" y="422" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="13" fill="#141312" text-anchor="middle">5</text><rect x="60" y="386" width="250" height="62" fill="#ffffff" stroke="#a8a097" stroke-width="1" stroke-dasharray="4 4"/><text x="185" y="422" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#a8a097" text-anchor="middle" font-style="italic">no assistant step</text><rect x="360" y="386" width="260" height="62" fill="#ffffff" stroke="#cc3a1f" stroke-width="2"/><text x="490" y="412" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-weight="600">Developer</text><text x="490" y="433" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">runs start.py in a real terminal</text><circle cx="32" cy="491" r="13" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="32" y="496" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="13" fill="#141312" text-anchor="middle">6</text><rect x="60" y="460" width="250" height="62" fill="#ffffff" stroke="#141312" stroke-width="1.5"/><text x="185" y="486" font-family="'JetBrains Mono', Menlo, ui-monospace, monospace" font-size="14" fill="#141312" text-anchor="middle" font-weight="700">implement-story</text><text x="185" y="507" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">tests first, code only inside scope</text><polyline points="310,491 356,491" fill="none" stroke="#cc3a1f" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="460" width="260" height="62" fill="#ffffff" stroke="#cc3a1f" stroke-width="2"/><text x="490" y="486" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-weight="600">Named reviewer</text><text x="490" y="507" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b635a" text-anchor="middle">reviews the PR; checks gate merge</text><text x="320" y="558" font-family="Georgia, 'Source Serif 4', serif" font-size="15" fill="#141312" text-anchor="middle" font-style="italic">Each step needs the one above it confirmed before it can start.</text></svg>
