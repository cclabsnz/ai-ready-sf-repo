name: ai-framework
on:
  pull_request:
    paths: ["framework/**", "tools/**", ".claude/**", ".github/**", "force-app/**", "fixtures/**", "demo/**", "impacts/**", ".ai-framework.json"]
  # Only the optional live-consistency job runs on this; every other job is gated to pull_request.
  # No schedule until the owner decides on a CI baseline for the guard.
  workflow_dispatch:
jobs:
  guard-and-lint:
    if: github.event_name == 'pull_request'
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Guard blocks on this OS
        shell: bash  # Git Bash on Windows, so the test's bash is not the WSL launcher
        run: python tools/guard/test_guard.py
      # Tracked files only: a contributor's local, git-ignored exports are never read here.
      - name: Real-data scan
        run: python tools/guard/scan_data.py --tracked
      - name: Real-data scanner tests
        run: python tools/guard/test_scan_data.py
      - name: Framework lint
        run: python tools/build/lint.py
      - name: Rendered outputs are current
        run: python tools/build/render.py --check
      - name: Render check tests
        run: python tools/build/test_render.py
      - name: Build index on fixtures
        run: python tools/index/build_index.py --root fixtures --out ../index-ci
      - name: Index evidence opens from the repo root
        run: python tools/index/test_index.py
      - name: Index parser tests
        run: python tools/index/test_parsers.py
      - name: Demo filler generator tests
        run: python tools/demo/test_generate_filler.py
      - name: Demo answer-key checker tests
        run: python tools/demo/test_check_answers.py
      - name: Committed demo filler is current
        run: python tools/demo/generate_filler.py --seed 2026 --out demo/org --check
      - name: Agent trajectory eval (sample)
        run: python tools/evals/run_agent.py --log framework/agents/evals/sample-run.jsonl --spec framework/agents/evals/analyst.json
      - name: Impact record validator tests
        run: python tools/impacts/test_validate.py
      - name: Impact register tests
        run: python tools/impacts/test_register.py
      - name: Impact report writer tests
        run: python tools/impacts/test_write_report.py
      - name: Impact promotion tests
        run: python tools/impacts/test_promote.py
      - name: Impact register view tests
        run: python tools/impacts/test_render_register.py
      - name: PR check tests
        run: python tools/impacts/test_pr_check.py
      - name: Demo answer-to-draft tests
        run: python tools/demo/test_answer_to_draft.py
      - name: Skill eval runner tests
        run: python tools/evals/test_run_skill.py
      # index/ is untracked. The --all checks below read no index; this keeps index/ built from sourceRoot.
      - name: Build index from .ai-framework.json
        run: python tools/index/build_index.py --from-config
      - name: Committed impact records are valid
        run: python tools/impacts/validate.py --all
      - name: Acceptance-criteria check tests
        run: python tools/stories/test_check_ac.py
      - name: Story validator tests
        run: python tools/stories/test_validate_story.py
      - name: Story writer tests
        run: python tools/stories/test_write_story.py
      - name: Index edge-seeds tests
        run: python tools/index/test_edge_seeds.py
      - name: Committed stories are valid
        run: python tools/stories/validate_story.py --all
      - name: Framework config tests
        run: python tools/config/test_framework_config.py
      - name: Onboarding tests
        run: python tools/onboard/test_onboard.py
      - name: Design validator tests
        run: python tools/designs/test_validate_design.py
      - name: Design writer tests
        run: python tools/designs/test_write_design.py
      - name: Committed designs are valid
        run: python tools/designs/validate_design.py --all
      - name: Trace check tests
        run: python tools/code/test_check_trace.py
      - name: Apex rule check tests
        run: python tools/code/test_check_rules.py
      - name: Change writer tests
        run: python tools/code/test_write_change.py
      - name: Build package tests
        run: python tools/impacts/test_package.py
      - name: Build session start tests
        run: python tools/impacts/test_start.py
      - name: Agent trajectory eval (builder sample)
        run: python tools/evals/run_agent.py --log framework/agents/evals/builder-sample-run.jsonl --spec framework/agents/evals/builder.json
      # Exits 1 when the configured source root has a rule finding that tools/code/baseline.json does not hold.
      - name: Apex rule check (baseline)
        run: python tools/code/check_rules.py --from-config
      - name: Consistency comparer tests
        run: python tools/evals/test_consistency.py
      - name: Live runner tests (fake runner, no model call)
        run: python tools/evals/test_run_all.py
      - name: Measurement score tests
        run: python demo/measure/test_score.py
      - name: Measurement timing tests
        run: python demo/measure/test_timing.py
      - name: Walkthrough check tests
        run: python tools/demo/test_walkthrough_check.py
      # The walkthrough's deterministic path against demo/expected/, on both OSes through the matrix.
      - name: Walkthrough deterministic path
        run: python tools/demo/walkthrough_check.py
  impact-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No later step needs git credentials: git diff reads refs fetched here, and gh uses GH_TOKEN.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      # The base branch, checked out after the head so the head checkout's clean step cannot remove it.
      # The check code (pr_check, register, validate, build_index, framework_config), settings (including
      # the source root in .ai-framework.json) and the register all come from here; only data (the
      # metadata under that source root, impact records, the diff) comes from the PR. So a PR cannot
      # relax its own check, except the PR that first adds pr_check (see "Impact checks").
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The source root is read from the base branch's .ai-framework.json; demo/org when the base has no
      # config tool yet. An invalid base config makes framework_config exit 2, which fails this step.
      - name: Build index on the source root
        run: |
          builder=tools/index/build_index.py
          if [ -f base/tools/index/build_index.py ]; then builder=base/tools/index/build_index.py; fi
          src=demo/org
          if [ -f base/tools/config/framework_config.py ]; then src="$(python base/tools/config/framework_config.py source-root --root base)"; fi
          python "$builder" --root "$src" --out "$GITHUB_WORKSPACE/index"
      - name: Files changed against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
      - name: Open pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # A failed listing leaves no open-prs.json, which pr_check reads as "no section".
        run: |
          if gh pr list --state open --json number,headRefName,files --limit 100 > open-prs.tmp; then
            mv open-prs.tmp open-prs.json
          else
            echo "::warning::gh pr list failed; the open-PR section is omitted"
          fi
      - name: Impact checks
        id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
        # The base branch's pr_check runs whenever it exists. Only the PR that first adds pr_check runs its
        # own copy, and the result says so.
        run: |
          code=0
          checker=base/tools/impacts/pr_check.py
          note=""
          if [ ! -f "$checker" ]; then
            checker=tools/impacts/pr_check.py
            note="Note: this check ran from this PR's own copy of pr_check.py, because the base branch has no pr_check yet."
          fi
          python "$checker" --index "$GITHUB_WORKSPACE/index" --changed changed.txt --branch "$HEAD_REF" --open-prs open-prs.json --root . --base-root base > pr-check.out || code=$?
          : > pr-check.md
          if [ -n "$note" ]; then printf '%s\n\n' "$note" >> pr-check.md; fi
          if [ -s pr-check.out ]; then
            cat pr-check.out >> pr-check.md
          else
            echo "Impact check could not run (exit $code); see the job log." >> pr-check.md
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Step summary
        run: cat pr-check.md >> "$GITHUB_STEP_SUMMARY"
      # Fork PRs get a read-only token, so this step may fail; the summary above is already written.
      - name: PR comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --edit-last --body-file pr-check.md || gh pr comment "$PR_NUMBER" --body-file pr-check.md
      # check_trace runs for every build package this PR adds or changes. As with pr_check, the code comes from the
      # base branch (check_trace.py and the guard-owned trace_core.py it loads beside itself) and only the data (the
      # package and the test files) from the PR. Until the base branch has both, this PR's own copies run and the
      # summary says so. Like every framework check by default, it reports and exits 0: a gap or an unusable
      # package is a warning plus the JSON in the step summary. Failing the job on a gap is an owner decision.
      - name: Trace check for changed build packages
        run: |
          code=0
          checker=base/tools/code/check_trace.py
          note=""
          if [ ! -f "$checker" ] || [ ! -f base/tools/guard/trace_core.py ]; then
            checker=tools/code/check_trace.py
            note="Note: the trace check ran from this PR's own copy of check_trace.py and its core, because the base branch lacks one of them."
          fi
          grep -E '^impacts/[^/]+/build-package\.json$' changed.txt > packages.txt || true
          : > trace.md
          if [ -s packages.txt ] && [ -n "$note" ]; then printf '%s\n\n' "$note" >> trace.md; fi
          while IFS= read -r pkg; do
            if [ ! -f "$pkg" ]; then continue; fi
            folder="$(dirname "$pkg")"
            id="$(basename "$folder" | grep -oE '^[A-Z][A-Z0-9]*-[0-9]+' || true)"
            printf '### Trace check: %s\n\n' "$pkg" >> trace.md
            if [ -z "$id" ]; then
              echo "The folder name holds no story id." >> trace.md
              code=1
              continue
            fi
            printf '```json\n' >> trace.md
            python "$checker" "$id" --root . >> trace.md 2>> trace.err || code=1
            printf '```\n\n' >> trace.md
          done < packages.txt
          if [ -s trace.err ]; then cat trace.err; fi
          if [ -s trace.md ]; then cat trace.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$code" != "0" ]; then echo "::warning::check_trace found gaps or an unusable build package; see the step summary"; fi
      # The base branch's check_rules scans this PR's source root (read from the base config, as the index step does)
      # with this PR's tools/code/baseline.json, and compares that baseline with the base branch's copy: a new finding
      # or a grown baseline exits 1 and fails the job. --from-config is not used here, because it would scan the base
      # checkout instead of the PR. --root is the PR workspace, so the relative --compare-baseline path resolves to
      # the base checkout's file. Skipped while the base branch has no check_rules; the comparison is skipped while
      # it has no baseline.
      - name: Apex rule check against the base baseline
        run: |
          if [ ! -f base/tools/code/check_rules.py ]; then
            echo "The base branch has no tools/code/check_rules.py yet; the rule check is skipped."
            exit 0
          fi
          src=demo/org
          if [ -f base/tools/config/framework_config.py ]; then src="$(python base/tools/config/framework_config.py source-root --root base)"; fi
          if [ -f base/tools/code/baseline.json ]; then
            python base/tools/code/check_rules.py --root . --source-root "$src" --compare-baseline base/tools/code/baseline.json
          else
            echo "The base branch has no tools/code/baseline.json; the baseline comparison is skipped."
            python base/tools/code/check_rules.py --root . --source-root "$src"
          fi
      - name: Exit with the check's code
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: exit "${CODE:-2}"
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action v2 needs the token to list a pull request's commits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Optional live consistency run: started by hand (workflow_dispatch) from the default branch only, never on
  # pull_request. It calls the model with the ANTHROPIC_API_KEY repository secret, so it is not a required check.
  # run_all.py runs one case N times, consistency.py compares the run folders, and the folders are uploaded for review.
  # Golden outputs are committed by a human after review, never by this job.
  live-consistency:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CASE: story-impact/004-escalation-hops-3
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      # An exact, reviewed version: this package later receives the API key. Change it only by a reviewed PR.
      - name: Install Claude Code
        env:
          PNPM_HOME: /home/runner/.pnpm-global
        run: |
          export PATH="$PNPM_HOME:$PATH"
          pnpm add -g @anthropic-ai/claude-code@2.1.300
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
      # The secret reaches only this step, the one that calls claude.
      - name: Live runs for one case
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/evals/run_all.py --case "$CASE"
      - name: Agreement across the runs
        if: always()
        run: |
          runs="ai-context/evals/${CASE//\//-}"
          if [ ! -d "$runs" ]; then echo "No run folders were written."; exit 1; fi
          python tools/evals/consistency.py --text "$runs"/run-*
      - name: Upload the run folders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-consistency
          path: ai-context/evals/
          if-no-files-found: warn
